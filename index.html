<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias de IA</title>
    <!-- Estilos Internos -->
    <link rel="stylesheet" href="styles.css">
    <!-- Conexão API Google Fonts -->
    <script src="script.js" defer></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" >
</head>
<body class="page">
    <header class="header">
        <h1 class="header_title">Últimas Notícias de IA</h1>

        <div class="header_controls">
            <div class="control-group">
                <label for="color-picker">Cor:</label>
                <input type="color" id="color-picker" class="control-group__inputs">
            </div>

            <div class="control_group">
                <label for="font-select">Fonte:</label>
                <select id="font-select" class="control-group__select">
                    <option value="Roboto">Roboto</option>
                    <option value="Open Sans">Open Sans</option>
                    <option value="Montserrat">Montserrat</option>
                </select>
            </div>

            <div class="control-group">
                <label for="article-color-picker">Cor dos Artigos:</label>
                <input type="color" id="article-color-picker" class="control-group__inputs">
            </div>

            <button id="theme-toggle" class="header__theme-toggle">
                <span class="material-icons">dark_mode</span>
            </button>
        </div>
    </header>

    <main class="main">
        <article class="news">
            <h2 class="news__title">Avanços recentes em IA</h2>
            <p class="news__content">A inteligência artificial</p>
        </article>

        </article>

        </article>

    </main>
    
</body>
</html>
